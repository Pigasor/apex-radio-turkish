name: Installateur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Python portable (embeddable) + composants
        shell: pwsh
        run: |
          $py = "3.12.10"
          New-Item -ItemType Directory -Force build\app | Out-Null
          # fichiers de l'appli
          $files = Get-ChildItem -File | Where-Object { $_.Name -notin @("Lancer.bat", "Demo.bat", "build_public.py", ".gitignore", ".gitattributes", "CLAUDE.md", "CHANGELOG.md") }
          Copy-Item $files build\app\
          Copy-Item -Recurse ui, vendor build\app\
          # lanceur ApexRadio.exe (compilateur C# de .NET Framework, présent sur Windows)
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ /win32icon:apex.ico /r:System.Windows.Forms.dll /out:build\app\ApexRadio.exe launcher\ApexRadio.cs
          if (-not (Test-Path build\app\ApexRadio.exe)) { throw "ApexRadio.exe non construit" }
          # Python portable
          Invoke-WebRequest "https://www.python.org/ftp/python/$py/python-$py-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip build\app\python
          $pth = Get-ChildItem build\app\python\python*._pth | Select-Object -First 1
          Set-Content $pth.FullName "python312.zip`r`n.`r`nLib\site-packages`r`n..`r`nimport site"
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          build\app\python\python.exe get-pip.py --no-warn-script-location
          build\app\python\python.exe -m pip install --no-warn-script-location setuptools wheel
          build\app\python\python.exe -m pip install --no-warn-script-location -r requirements.txt
          build\app\python\python.exe -c "import piper, faster_whisper, sounddevice, pygame, pystray, PIL, webview; print('composants OK')"

      - name: Voix turque + reconnaissance vocale incluses (rien à télécharger au 1er lancement)
        shell: pwsh
        run: |
          $m = "build\app\bundled"   # pas « models » : paths.migrate() le déplacerait hors du dossier de l'appli
          New-Item -ItemType Directory -Force "$m\whisper\small" | Out-Null
          $files = @{
            "$m\tr_TR-dfki-medium.onnx"      = "https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx"
            "$m\tr_TR-dfki-medium.onnx.json" = "https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx.json"
          }
          foreach ($f in "config.json", "tokenizer.json", "vocabulary.txt", "model.bin") {
            $files["$m\whisper\small\$f"] = "https://huggingface.co/Systran/faster-whisper-small/resolve/main/$f"
          }
          foreach ($dest in $files.Keys) {
            curl.exe -fL --retry 10 --retry-all-errors --retry-delay 5 -C - -o $dest $files[$dest]
            if ($LASTEXITCODE -ne 0) { throw "téléchargement impossible : $($files[$dest])" }
          }
          Get-ChildItem -Recurse $m -File | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName }
          build\app\python\python.exe -c "from faster_whisper import WhisperModel; WhisperModel(r'build\app\bundled\whisper\small', device='cpu', compute_type='int8'); from piper import PiperVoice; PiperVoice.load(r'build\app\bundled\tr_TR-dfki-medium.onnx', config_path=r'build\app\bundled\tr_TR-dfki-medium.onnx.json'); print('modèles OK')"

      - name: Test de démarrage (import de l'appli)
        shell: pwsh
        working-directory: build\app
        run: python\python.exe -c "import strategy, questions, laptimes, behavior, setups, tactics, alerts, debrief, i18n, updates, desktop, pystray; print('appli OK')"

      - name: Test de la fenêtre intégrée (WebView2)
        shell: pwsh
        continue-on-error: true
        working-directory: build\app
        run: python\python.exe ..\..\.github\scripts\smoke_window.py

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          foreach ($f in "build\app\bundled\whisper\small\model.bin", "build\app\bundled\tr_TR-dfki-medium.onnx") {
            if (-not (Test-Path $f)) { throw "modèle absent avant l'installateur : $f" }
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" installer\ApexRadio.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ApexRadio-Setup-${{ steps.v.outputs.version }}
          path: dist\*.exe

      - name: Version déjà publiée ?
        id: known
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "existed=true" >> $env:GITHUB_OUTPUT } else { "existed=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Publication (Release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Apex Radio ${{ steps.v.outputs.version }}
          body_path: installer/release-notes.md
          files: dist/*.exe

      - name: Annonce sur Discord (nouvelle version seulement)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.known.outputs.existed == 'false'
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python .github/scripts/discord_announce.py

      - name: Version de test déjà publiée ?
        id: knowntest
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.v.outputs.version }}-test" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "existed=true" >> $env:GITHUB_OUTPUT } else { "existed=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Version de test (branche)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-test
          name: Apex Radio ${{ steps.v.outputs.version }} (test)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "Version de test, pas encore publiée / Test build, not released yet."
          files: dist/*.exe

      - name: Annonce accès anticipé sur Discord (nouvelle version de test seulement)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && steps.knowntest.outputs.existed == 'false'
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_WEBHOOK_EARLY: ${{ secrets.DISCORD_WEBHOOK_EARLY }}
        run: python .github/scripts/discord_announce.py --early
